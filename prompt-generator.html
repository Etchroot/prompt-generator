<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 프롬프트 생성기</title>
<style>
/* shadcn/ui 기본 토큰 (slate) */
:root{
  --background:#ffffff; --foreground:#020817; --card:#ffffff; --card-foreground:#020817;
  --muted:#f1f5f9; --muted-foreground:#64748b; --border:#e2e8f0; --input:#e2e8f0;
  --primary:#0f172a; --primary-foreground:#f8fafc; --secondary:#f1f5f9; --secondary-foreground:#0f172a;
  --accent:#f1f5f9; --ring:#94a3b8; --ok:#15803d; --ok-bg:#dcfce7; --radius:8px;
}
@media (prefers-color-scheme:dark){
  :root{--background:#020817; --foreground:#f8fafc; --card:#0b1220; --card-foreground:#f8fafc;
    --muted:#1e293b; --muted-foreground:#94a3b8; --border:#1e293b; --input:#1e293b;
    --primary:#f8fafc; --primary-foreground:#0f172a; --secondary:#1e293b; --secondary-foreground:#f8fafc;
    --accent:#1e293b; --ring:#cbd5e1; --ok:#4ade80; --ok-bg:#052e16;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.5 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.container{max-width:80rem;margin:0 auto;padding:16px}
@media (min-width:640px){.container{padding:24px}}
@media (min-width:768px){.container{padding:32px}}

/* 버튼 (shadcn Button) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:6px;font:inherit;font-size:14px;font-weight:500;height:40px;padding:0 16px;border:0;cursor:pointer;text-decoration:none;transition:background-color .15s,color .15s,opacity .15s}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--ring)}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{opacity:.9}
.btn-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.btn-secondary:hover{opacity:.8}
.btn-outline{border:1px solid var(--input);background:var(--background);color:var(--foreground)}
.btn-outline:hover,.btn-ghost:hover{background:var(--accent)}
.btn-ghost{background:transparent;color:var(--foreground)}
.btn-icon{width:40px;padding:0;flex:none}
.btn[aria-pressed=true] svg{color:var(--foreground)}

/* 카드 목록 (ProductCard) */
.page-head{margin-bottom:24px}
.page-head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.page-head p{margin:8px 0 0;color:var(--muted-foreground)}
.grid{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1280px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{position:relative;display:block;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--card-foreground);transition:all .3s ease-in-out}
.card:hover{box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1)}
.card:has(a:focus-visible){box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--ring)}
.card>a{display:block;color:inherit;text-decoration:none;outline:none}
.thumb{aspect-ratio:1/1;overflow:hidden}
.art{display:block;width:100%;height:100%;transition:transform .3s ease-in-out}
.art svg{display:block;width:100%;height:100%}
.card:hover .art{transform:scale(1.05)}
.card-body{padding:16px}
.card-body h3{margin:0;font-size:16px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body p{margin:4px 0 0;font-size:14px;color:var(--muted-foreground)}
.dot{color:var(--ok);font-weight:600}
.save{position:absolute;top:12px;right:12px;width:32px;height:32px;padding:0;border-radius:999px;opacity:0;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:all .3s}
.card:hover .save,.save:focus-visible,.save[aria-pressed=true]{opacity:1}
@media (hover:none){.save{opacity:1}}

/* 세부 페이지 */
.back{margin:0 0 16px -12px;padding:0 12px}
.detail-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:24px}
.detail-thumb{width:80px;height:80px;flex:none;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.detail-title{flex:1;min-width:0}
.detail-title h1{margin:2px 0 4px;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.muted{margin:0;font-size:14px;color:var(--muted-foreground)}
.detail-grid{display:grid;gap:24px;grid-template-columns:1fr;align-items:start}
@media (min-width:1024px){.detail-grid{grid-template-columns:1fr 1fr}.out{position:sticky;top:24px}}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:24px;box-shadow:0 1px 2px rgb(0 0 0/.05)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}

/* 입력 (shadcn Input · Textarea · Label) */
.label{display:block;margin:16px 0 6px;font-size:14px;font-weight:500}
.label .t{font-weight:400;color:var(--muted-foreground);margin-left:4px}
.input{display:block;width:100%;height:40px;border-radius:6px;border:1px solid var(--input);background:var(--background);padding:8px 12px;font:inherit;font-size:16px;color:var(--foreground)}
textarea.input{height:auto;min-height:80px;resize:vertical}
.input::placeholder{color:var(--muted-foreground)}
.input:focus{outline:none;box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--ring)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.checks input{width:16px;height:16px;margin:0;accent-color:var(--primary)}

/* 결과 */
#badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.badge{display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--border);padding:2px 10px;font-size:12px;font-weight:600;color:var(--muted-foreground)}
.badge.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
pre{white-space:pre-wrap;word-break:break-word;background:var(--muted);border-radius:6px;padding:16px;margin:0;min-height:240px;max-height:60vh;overflow:auto;font:15px/1.7 "D2Coding",ui-monospace,Consolas,"Malgun Gothic",monospace}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#tips{margin:16px 0 0;padding-left:20px;font-size:14px;color:var(--muted-foreground)}
#tips b{color:var(--foreground);font-weight:600}
@media (max-width:480px){.detail-thumb{width:56px;height:56px}.detail-title h1{font-size:24px}.panel{padding:16px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOOLS = {'①':'세 가지 유형','②':'예시','③':'페르소나','④':'마크다운','⑤':'강도·톤','⑥':'대안·이용자','⑦':'레시피·역질문·검증'};
const lines = s => (s || '').split('\n').map(t => t.trim()).filter(Boolean);

// 탭마다: 칸(fields) · 체크박스(checks) · 조합 규칙(build) · 예시(example)
const TABS = {
  text: {
    label: '✍️ 글',
    fields: [
      {id:'role', label:'역할', tool:'③', ph:'예: 10년차 백엔드 개발자이자 친절한 멘토', tip:'역할·경력·분야를 주면 수준이 맞아요'},
      {id:'context', label:'맥락', tool:'①', type:'area', ph:'지금 상황을 이야기하듯 써 주세요', tip:'AI는 우리 사정을 몰라요'},
      {id:'task', label:'할 일', ph:'예: 원인 후보와 고치는 방법을 알려 줘'},
      {id:'data', label:'자료', type:'area', ph:"코드·로그·글을 붙여 넣으면 ''' 상자로 감싸져요"},
      {id:'rules', label:'꼭 지킬 것', tool:'⑤', type:'area', ph:'한 줄에 하나씩', tip:'중요한 조건은 따로 강하게'},
      {id:'tone', label:'말투', tool:'⑤', ph:'예: 친근하지만 정확하게'},
      {id:'reader', label:'듣는 사람', tool:'⑥', ph:'예: JavaScript 3주 차 초보', tip:'듣는 사람에 맞춰 설명 수준이 바뀌어요'},
      {id:'format', label:'출력 형식', tool:'④', type:'area', ph:'한 줄에 한 부분씩, 순서대로\n예: 1) 표: | 항목 | 설명 |\n2) 요약 3줄', tip:'답의 모양을 정해 주세요'},
      {id:'length', label:'분량', tool:'⑤', ph:'예: A4 한 장 이내 / 위 형식 외의 섹션은 넣지 않기', tip:'안 정하면 AI가 알아서 늘려요'},
      {id:'example', label:'예시', tool:'②', type:'area', ph:'이런 모양으로 답해 줘 (원샷·퓨샷)', tip:'예시 하나면 모양이 그대로 따라와요'},
    ],
    checks: [
      {id:'alt', label:'대안 3안', tool:'⑥', text:'서로 다른 대안 3안을 주고, 장단점과 추천 1개를 알려 줘.'},
      {id:'rev', label:'역발상', tool:'⑥', text:'뻔한 답 말고 역발상 아이디어도 1개 넣어 줘.'},
      {id:'step', label:'단계별', tool:'⑦', text:'단계별로 차근차근 생각해서 순서대로 정리해 줘.'},
      {id:'ask', label:'먼저 질문해 줘', tool:'⑦', text:'바로 답하지 말고, 더 좋은 답에 필요한 질문을 한 번에 하나씩 먼저 해 줘.'},
      {id:'verify', label:'쪼개서 확인', tool:'⑦', text:'한 번에 다 하지 말고 단계마다 나에게 확인받고 진행해 줘.'},
    ],
    build(d, use) {
      const s = [];
      if (d.role) s.push('# 역할\n' + d.role);
      if (d.context) s.push('# 맥락\n' + d.context);
      if (d.task) s.push('# 할 일\n' + d.task);
      if (d.data) s.push("# 자료\n'''\n" + d.data + "\n'''");
      if (d.rules) s.push('# 꼭 지킬 것\n' + lines(d.rules).map(l => '> ' + l).join('\n'));
      const who = [d.tone && '- 말투: ' + d.tone, d.reader && '- 듣는 사람: ' + d.reader].filter(Boolean);
      if (who.length) s.push('# 말투와 듣는 사람\n' + who.join('\n'));
      if (d.format) { s.push('# 출력 형식\n' + lines(d.format).join('\n')); use('①'); }
      if (d.length) s.push('# 분량\n' + d.length);
      if (d.example) s.push("# 예시\n'''\n" + d.example + "\n'''");
      const how = this.checks.filter(c => d[c.id]).map(c => (use(c.tool), '- ' + c.text));
      if (how.length) s.push('# 진행 방식\n' + how.join('\n'));
      if (s.length > 1) use('④');
      return s.join('\n\n');
    },
    example: {
      role:'10년차 시니어 프론트엔드 개발자이자 명탐정처럼 추리하는 멘토',
      context:'부트캠프 팀 프로젝트에서 결제 버튼을 빠르게 두 번 누르면 결제가 두 번 되는 버그가 생겼어. 마감은 내일이야.',
      task:'원인 후보(용의자) 3개와 각각 확인할 테스트, 그리고 진범과 고치는 방법을 알려 줘.',
      data:'버튼 연타 가능 / 서버 응답 2초 / 로그에 같은 주문번호 2개',
      rules:'수정 코드는 JavaScript로\n원인은 3개 이내\n모르면 모른다고 말하기\n테스트는 결제 테스트 모드에서 하라고 안내하기\n코드는 그대로 붙여넣어 실행되게 (쓰는 변수는 모두 선언)\n답하기 전에 연타·성공 후 재클릭 상황에서도 결제가 한 번만 되는지 스스로 점검하기',
      tone:'탐정 소설처럼 재미있게, 설명은 정확하게', reader:'JavaScript 3주 차 초보',
      format:'1) 용의자 표: | 용의자 | 알리바이 확인 방법 | 결과 |\n2) 진범 한 줄\n3) 수정 코드 + 초보용 해설 3줄',
      length:'위 세 부분만, 그 밖의 섹션은 넣지 않기 (전체 A4 한 장 이내)', example:'', step:true,
    },
  },

  image: {
    label: '🎨 이미지',
    fields: [
      {id:'use', label:'용도', tool:'①', ph:'예: 30초 릴스 컷 1의 첫 장면', tip:'어디에 쓸지 알려 주세요'},
      {id:'ratio', label:'비율', type:'select', opts:['9:16 세로','1:1 정사각','16:9 가로','4:5 세로']},
      {id:'char', label:'캐릭터 설정', tool:'③', type:'area', ph:'생김새·옷·색을 자세히 — 컷마다 똑같이 복사', tip:'고정해 두면 컷마다 주인공이 같아요'},
      {id:'scene', label:'장면', type:'area', ph:'어디서, 무엇을 하고 있나'},
      {id:'subject', label:'주제', ph:'한 줄로: 이 그림이 말하려는 것'},
      {id:'detail', label:'디테일', tool:'⑤', ph:'조명·소품·표정·시간대', tip:'디테일이 결과를 구체적으로 만들어요'},
      {id:'style', label:'스타일', tool:'②', ph:'예: 3D 애니메이션, 따뜻한 색감', tip:'스타일 예시를 주면 톤이 일정해요'},
      {id:'text', label:'글자', ph:'화면에 넣을 글자 (따옴표는 자동)'},
    ],
    checks: [
      {id:'noPerson', label:'실존 인물 없이', text:'실존 인물'},
      {id:'noLogo', label:'로고 없이', text:'브랜드 로고'},
      {id:'noText', label:'글자 없이', text:'화면 속 글자'},
      {id:'noMark', label:'워터마크 없이', text:'워터마크'},
    ],
    build(d, use) {
      const s = ['이미지를 만들어 줘.'];
      const add = (k, v) => v && s.push('- ' + k + ': ' + v);
      add('용도', d.use); add('비율', d.ratio); add('캐릭터', d.char); add('장면', d.scene);
      add('주제', d.subject); add('디테일', d.detail); add('스타일', d.style);
      if (d.text) { s.push('- 화면 글자: "' + d.text.replace(/["“”']/g, '') + '" (이 글자만, 철자 그대로)'); use('⑤'); }
      const avoid = this.checks.filter(c => d[c.id]).map(c => c.id === 'noText' && d.text ? '지정한 것 외의 글자' : c.text);
      if (avoid.length) { s.push('- 피할 것: ' + avoid.join(', ') + ' 없이'); use('⑤'); }
      if (s.length > 2) use('④');
      return s.length > 1 ? s.join('\n') : '';
    },
    example: {
      use:'30초 릴스 「로로의 금요일 밤」 컷 1 첫 장면', ratio:'9:16 세로',
      char:'로로: 손바닥만 한 주황색 아기 너구리 마스코트, 노란 비옷, 동그란 큰 눈, 통통한 꼬리',
      scene:'비 오는 금요일 밤, 작은 원룸 창가 책상 앞에서 컵라면을 들고 설레는 표정',
      subject:'혼자여도 즐거운 금요일 밤', detail:'창밖 빗방울, 스탠드의 노란 조명, 김이 살짝 나는 컵라면',
      style:'따뜻한 색감의 3D 애니메이션, 부드러운 조명', text:'',
      noPerson:true, noLogo:true, noText:true, noMark:true,
    },
  },

  video: {
    label: '🎬 영상 컷',
    fields: [
      {id:'common', label:'[공통 설정]', tool:'⑤', type:'area', ph:'인물·옷·색감·장소·스타일 — 모든 컷에 똑같이 (비우기 해도 남아요)', tip:'컷마다 같은 문장을 넣어야 이어져요'},
      {id:'cut', label:'컷 번호', type:'select', opts:['1','2','3','4']},
      {id:'len', label:'길이', type:'select', opts:['8초','6초','4초']},
      {id:'img', label:'시작 이미지', type:'select', opts:['첨부함','첨부 안 함']},
      {id:'keep', label:'그대로 둘 것', tool:'⑤', type:'area', ph:'한 줄에 하나씩: 색·옷·배경 등', tip:'바뀌면 안 되는 것을 적어요'},
      {id:'from', label:'동작 — 처음', tool:'⑦', ph:'예: 컵라면 뚜껑을 잡는다', tip:'처음 → 끝 순서로 동작은 하나만'},
      {id:'to', label:'동작 — 끝', ph:'예: 김이 확 올라와 깜짝 놀란다'},
      {id:'camera', label:'카메라', ph:'예: 천천히 줌인, 고정'},
      {id:'sound', label:'소리', ph:'예: 빗소리, 뚜껑 여는 소리 (대사 없음)'},
      {id:'avoid', label:'피할 것', tool:'⑤', type:'area', ph:'한 줄에 하나씩', tip:'글자·로고 같은 사고를 막아요'},
    ],
    keep: ['common'],
    build(d, use) {
      const s = ['# 컷 ' + (d.cut || '1') + ' · ' + (d.len || '8초') + ' · 세로 9:16'];
      if (d.common) s.push('## 공통 설정 (모든 컷 동일)\n' + d.common);
      if ((d.img || '첨부함') === '첨부함') s.push('## 시작 장면\n첨부한 이미지를 첫 프레임으로 그대로 사용해 줘.');
      if (d.keep) s.push('## 그대로 둘 것\n' + lines(d.keep).map(l => '- ' + l).join('\n'));
      if (d.from || d.to) s.push('## 동작 (하나만, 천천히)\n처음: ' + (d.from || '—') + '\n끝: ' + (d.to || '—'));
      if (d.camera) s.push('## 카메라\n' + d.camera);
      if (d.sound) s.push('## 소리\n' + d.sound);
      const avoid = ['화면 속 글자·자막', '브랜드 로고', ...lines(d.avoid)];
      s.push('## 피할 것\n' + avoid.map(l => '- ' + l).join('\n'));
      use('④');
      return s.length > 2 || d.common ? s.join('\n\n') : '';
    },
    example: {

const KEY = 'my-prompt-generator';

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
let cur = null;
const data = () => (state[cur] = state[cur] || {});
const favs = () => (state._fav = state._fav || []);
const inProgress = k => Object.values(state[k] || {}).some(v => v === true || (typeof v === 'string' && v.trim()));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function favBtn(k, cls) {
  const on = favs().includes(k);
  return `<button type="button" class="btn ${cls}" data-fav="${k}" aria-pressed="${on}" aria-label="${META[k].title} 즐겨찾기" title="즐겨찾기">${icon('bookmark', on)}</button>`;
}

  $('app').innerHTML = `<div class="container">
    <header class="page-head"><h1>나만의 프롬프트 생성기</h1>
      <p>만들 프롬프트를 골라 주세요. 칸만 채우면 프롬프트가 완성되고, 입력한 내용은 이 브라우저에만 저장돼요.</p></header>
    <div class="grid">${Object.keys(TABS).map(k => `<div class="card">
      <a href="#/${k}" aria-label="${META[k].title}">
        <div class="thumb">${art(k)}</div>
        <div class="card-body"><h3>${META[k].title}</h3>
          <p>${META[k].cat}${inProgress(k) ? ' · <span class="dot">작성 중</span>' : ''}</p></div>
      </a>${favBtn(k, 'btn-secondary save')}</div>`).join('')}</div></div>`;
}

function renderDetail() {
  const m = META[cur];
  document.title = m.title + ' · 나만의 프롬프트 생성기';
  $('app').innerHTML = `<div class="container">
    <a class="btn btn-ghost back" href="#/">${icon('back')} 전체 생성기</a>
    <header class="detail-head">
      <div class="detail-thumb">${art(cur)}</div>
      <div class="detail-title"><p class="muted">${m.cat}</p><h1>${m.title}</h1><p class="muted">${m.desc}</p></div>
      ${favBtn(cur, 'btn-outline btn-icon')}
    </header>
    <div class="detail-grid">
      <section class="panel">
        <div class="panel-head"><h2>입력</h2><button type="button" class="btn btn-secondary" data-act="example">${icon('dice')} 예시 채우기</button></div>
        <form id="form" onsubmit="return false"></form>
      </section>
      <section class="panel out">
        <div class="panel-head"><h2>완성된 프롬프트</h2></div>
        <div id="badges"></div>
        <pre id="out"></pre>
        <div class="btns">
          <button type="button" class="btn btn-default" data-act="copy">${icon('copy')} <span>복사</span></button>
          <button type="button" class="btn btn-outline" data-act="download">${icon('download')} 저장</button>
          <button type="button" class="btn btn-ghost" data-act="clear">${icon('eraser')} 비우기</button>
        </div>
        <ul id="tips"></ul>
      </section>
    </div></div>`;
  renderForm(); renderOut();
}

function renderForm() {
  const t = TABS[cur], d = data();
  let h = t.fields.map(f => {
    const v = esc(d[f.id] ?? '');
    const lab = `<label class="label" for="f-${f.id}">${f.label}${f.tool ? `<span class="t">${f.tool}</span>` : ''}</label>`;
    if (f.type === 'select') return lab + `<select class="input" id="f-${f.id}" data-id="${f.id}">${f.opts.map(o => `<option${o === d[f.id] ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
    if (f.type === 'area') return lab + `<textarea class="input" id="f-${f.id}" data-id="${f.id}" placeholder="${esc(f.ph || '')}">${v}</textarea>`;
    return lab + `<input class="input" type="text" id="f-${f.id}" data-id="${f.id}" value="${v}" placeholder="${esc(f.ph || '')}">`;
  }).join('');
  if (t.checks && t.checks.length) {
    h += `<span class="label">${cur === 'image' ? '제약' : '진행 방식'}</span><div class="checks">` +
      t.checks.map(c => `<label><input type="checkbox" data-id="${c.id}"${d[c.id] ? ' checked' : ''}>${c.label}${c.tool ? ` <span class="muted">${c.tool}</span>` : ''}</label>`).join('') + '</div>';
  }
  $('form').innerHTML = h;
}

function renderOut() {
  const t = TABS[cur], d = data(), used = new Set();
  t.fields.forEach(f => { if (f.tool && d[f.id]) used.add(f.tool); });
  const text = t.build(d, k => used.add(k));
  $('out').textContent = text || '왼쪽 칸을 채우거나 예시 채우기를 눌러 보세요.';
  $('badges').innerHTML = Object.entries(TOOLS).map(([k, n]) =>
    `<span class="badge${used.has(k) ? ' on' : ''}">${k} ${n}</span>`).join('');
  const tips = t.fields.filter(f => f.tip && !d[f.id]).slice(0, 3);
  $('tips').innerHTML = tips.map(f => `<li>이걸 넣으면 좋아요: <b>${f.label} ${f.tool || ''}</b> — ${f.tip}</li>`).join('');
}

// ── 화면 이동: #/text 처럼 주소로 세부 페이지를 열어서 뒤로 가기도 동작
function show(k) {
  cur = TABS[k] ? k : null;
  cur ? renderDetail() : renderHome();
  window.scrollTo(0, 0);
}
const route = () => show(location.hash.replace(/^#\/?/, ''));
window.addEventListener('hashchange', route);

// 주소 바꾸기가 막힌 환경(미리보기 등)에서도 화면은 넘어가게
$('app').addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  const k = a.getAttribute('href').slice(2);
  try { history.pushState(null, '', '#/' + k); } catch (err) {}
  show(k);
});
window.addEventListener('popstate', route);

$('app').addEventListener('input', e => {
  const id = e.target.dataset.id;
  if (!id || !cur) return;
  data()[id] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  save(); renderOut();
});

$('app').addEventListener('click', async e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) {
    const k = fav.dataset.fav, list = favs(), i = list.indexOf(k);
    i < 0 ? list.push(k) : list.splice(i, 1);
    save();
    fav.setAttribute('aria-pressed', i < 0);
    fav.innerHTML = icon('bookmark', i < 0);
    return;
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  if (act === 'example') { state[cur] = {...TABS[cur].example}; save(); renderForm(); renderOut(); }
  if (act === 'clear') {
    const keep = {};
    (TABS[cur].keep || []).forEach(k => { if (data()[k]) keep[k] = data()[k]; });
    state[cur] = keep; save(); renderForm(); renderOut();
  }
  if (act === 'copy') {
    const text = $('out').textContent, label = e.target.closest('button').querySelector('span');
    try { await navigator.clipboard.writeText(text); }
    catch (err) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    label.textContent = '복사됨 ✓'; setTimeout(() => label.textContent = '복사', 1200);
  }
  if (act === 'download') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([$('out').textContent], {type:'text/plain;charset=utf-8'}));
    a.download = 'prompt-' + cur + '.txt'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
});

route();
</script>
</body>
</html>
